[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-your-data-agent"
version = "0.1.0"
description = "Plain-English questions to read-only SQL, answers, charts and the SQL shown. Claude API tool use, prompt caching, MCP server, benchmark."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "data/LICENSE-chinook.md"]
authors = [{ name = "Surendra Allam" }]
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.3,<3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
askdata = "askdata.cli:main"
askdata-mcp = "askdata.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
askdata = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
