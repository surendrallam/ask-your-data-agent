[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "askdata"
version = "0.1.0"
description = "Ask your data: a Claude agent that answers plain-English questions with read-only SQL, plus a benchmark across Claude models."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.3,<3",
  "mcp>=2.3,<3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pyyaml>=6",
  "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
askdata = "askdata.cli:main"
askdata-mcp = "askdata.mcp_server:main"
askdata-web = "askdata.web.app:main"

[tool.setuptools.packages.find]
include = ["askdata*", "bench*"]

[tool.setuptools.package-data]
askdata = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
