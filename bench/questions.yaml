# Benchmark: 45 answerable questions and 5 that should get a clarifying question.
#
# Grading is by execution, not by wording: the agent's final SQL (the query it cites
# in submit_answer) is re-run and its rows are compared with the rows of the
# reference SQL below. Every reference value must appear in the matching row of
# the agent's result; extra columns are fine. Counts must match exactly, money to
# 0.01% and ratios to 0.06 percentage points (fraction or percent both accepted).
#   ordered: rows must come in the same order
#   ratio: numeric values are rates, so 0.1234 and 12.34 both match
#   prefix: the agent may return more rows if the reference rows come first
#
# The reference SQL follows the glossary in data/glossary.yaml. Today is 2026-10-01.

- id: q01
  tags: [basic]
  question: What was total net revenue in FY2026?
  sql: |-
    SELECT ROUND(SUM(oi.quantity * oi.unit_price * (1 - oi.discount_pct)) - COALESCE(SUM(r.refund_amount), 0), 2)
    FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
    LEFT JOIN returns r ON r.order_item_id = oi.order_item_id
    WHERE o.status = 'completed' AND o.order_date BETWEEN '2025-04-01' AND '2026-03-31'

- id: q02
  tags: [basic]
  question: How many completed orders did we have in FY2026?
  sql: |-
    SELECT COUNT(*) FROM orders
    WHERE status = 'completed' AND order_date BETWEEN '2025-04-01' AND '2026-03-31'

- id: q03
  tags: [basic]
  question: What was gross revenue in Q1 FY2027?
  sql: |-
    SELECT ROUND(SUM(oi.quantity * oi.unit_price), 2)
    FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
    WHERE o.status = 'completed' AND o.order_date BETWEEN '2026-04-01' AND '2026-06-30'

- id: q04
  tags: [basic]
  question: How many customer accounts are in each segment?
  sql: |-
    SELECT segment, COUNT(*) FROM customers GROUP BY segment

- id: q05
  tags: [basic]
  question: How many orders were cancelled in FY2026?
  sql: |-
    SELECT COUNT(*) FROM orders
    WHERE status = 'cancelled' AND order_date BETWEEN '2025-04-01' AND '2026-03-31'

- id: q06
  tags: [basic]
  question: What is the list price of the Ridgeline UL 1P Tent?
  sql: |-
