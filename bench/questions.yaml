- id: q43
  tags: [entity]
  question: What were Priya Sharma's sales last quarter?
  sql: |-
    SELECT ROUND(SUM(oi.quantity * oi.unit_price * (1 - oi.discount_pct)) - COALESCE(SUM(r.refund_amount), 0), 2)
    FROM orders o JOIN customers c ON c.customer_id = o.customer_id
    JOIN sales_reps s ON s.rep_id = c.rep_id
    JOIN order_items oi ON oi.order_id = o.order_id
    LEFT JOIN returns r ON r.order_item_id = oi.order_item_id
    WHERE o.status = 'completed' AND s.rep_name = 'Priya Sharma'
      AND o.order_date BETWEEN '2026-07-01' AND '2026-09-30'

- id: q44
  tags: [basic]
  question: How many completed orders used each promo code in FY2026?
  sql: |-
    SELECT promo_code, COUNT(*) FROM orders
    WHERE status = 'completed' AND promo_code IS NOT NULL
      AND order_date BETWEEN '2025-04-01' AND '2026-03-31'
    GROUP BY promo_code

- id: q45
  tags: [basic]
  question: How much did we collect in shipping fees in FY2026?
  sql: |-
    SELECT ROUND(SUM(shipping_fee), 2) FROM orders
    WHERE status = 'completed' AND order_date BETWEEN '2025-04-01' AND '2026-03-31'

