name: CI

# No API key is configured here and none is needed: the tests use a scripted
# fake client (and one fake API server on 127.0.0.1), and tests/conftest.py
# refuses every other network connection.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Build the sample database
        run: python -m askdata.seed
      - name: Tests (offline)
        run: python -m pytest -q
      - name: Reference SQL dry run (no API calls)
        run: python -m bench.run --dry-run
