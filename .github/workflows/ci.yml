name: CI

# No API key is configured here and none is needed: tests use a scripted fake
# client, block outbound network and fail if a real Anthropic client is built.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests (mocked client, network blocked)
        run: pytest
      - name: Expected answers match the database
        run: python -m bench.build_expected --check
      - name: Benchmark dry run (scripted client, no API calls)
        run: python -m bench.run_bench --dry-run
